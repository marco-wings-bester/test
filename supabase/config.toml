# ─── Edge Function secrets ────────────────────────────────────────────────────
# Set these with:  supabase secrets set KEY=value
# Or in the Supabase Dashboard → Edge Functions → Secrets
#
# Required:
#   OPENAI_API_KEY          (for Whisper transcription)
#   ANTHROPIC_API_KEY       (for Claude task synthesis)
#
# Optional overrides:
#   TRANSCRIPTION_PROVIDER  openai | google  (default: openai)
#   LLM_PROVIDER            claude | openai  (default: claude)
#   GOOGLE_SERVICE_ACCOUNT_JSON   (base64-encoded JSON, only if using Google STT)
